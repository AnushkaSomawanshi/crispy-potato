apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: orbital-mission-reader
rules:
- apiGroups: ["", "apps"]
  resources: ["pods", "deployments", "services", "namespaces"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: orbital-mission-reader-binding
subjects:
- kind: ServiceAccount
  name: default
  namespace: orbital-mission
- kind: ServiceAccount
  name: default
  namespace: default
roleRef:
  kind: ClusterRole
  name: orbital-mission-reader
  apiGroup: rbac.authorization.k8s.io
