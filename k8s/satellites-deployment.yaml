apiVersion: apps/v1
kind: Deployment
metadata:
  name: satellite-01
  namespace: orbital-mission
spec:
  replicas: 1
  selector:
    matchLabels:
      app: satellite-01
  template:
    metadata:
      labels:
        app: satellite-01
    spec:
      containers:
      - name: satellite-node
        image: orbital-satellite-node:latest
        imagePullPolicy: IfNotPresent
        command: ["python", "satellites/satellite_node.py"]
        args: ["--id", "SAT-01", "--grpc-port", "5001", "--p2p-port", "6001", "--registry", "http://mission-control-backend:8000"]
        ports:
        - containerPort: 5001
        - containerPort: 6001
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
